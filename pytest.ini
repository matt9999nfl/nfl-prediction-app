[pytest]
# Root-level config (PROMPT-PYTHON-TESTS-IN-CI.md). Lets `pytest` collect and
# run the whole repo's Python suite from one place -- the repo root -- rather
# than depending on which directory a person happens to be standing in.
# Component-local configs (03-BACKEND-API/pyproject.toml,
# 06-TESTING-QA/pytest.ini) are unaffected: pytest uses whichever config file
# is closest to the paths given on the command line, so `cd 03-BACKEND-API &&
# pytest` still uses its own pyproject.toml as before.
#
# Markers mirror 06-TESTING-QA/pytest.ini (integration, live, nightly) plus
# needs_credentials, new here: tests that construct a real, unmocked GCP
# client and will hang or fail without ambient credentials (found while
# building the CI workflow, 2026-09-19 -- see the workflow's own comment for
# which tests and why). Registering all four here means every test in the
# repo that uses one of these marks -- 03-BACKEND-API's
# test_scoping_hash_roundtrip.py included -- stops warning "Unknown mark"
# when the whole suite is collected together, without touching that test's
# own file or its component-local config.
markers =
    integration: touches BigQuery or other live infrastructure
    live: requires a deployed API_BASE_URL
    nightly: full backtest replay, data quality checks
    needs_credentials: requires real, unmocked GCP credentials (BigQuery/GCS) -- excluded from the credential-less CI job

python_files = test_*.py
python_classes = Test*
python_functions = test_*
