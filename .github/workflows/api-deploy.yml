name: Deploy BACKEND-API

on:
  push:
    branches:
      - main
    paths:
      - '03-BACKEND-API/**'
      - '.github/workflows/api-deploy.yml'

env:
  PROJECT_ID: nfl-model-471509
  REGION: us-central1
  SERVICE_NAME: nfl-backend-api
  IMAGE_NAME: nfl-backend-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use gcloud for authentication
        run: gcloud auth configure-docker

      - name: Build Docker image
        run: |
          git_commit=$(git rev-parse --short HEAD)
          docker build \
            --build-arg GIT_COMMIT=$git_commit \
            -t gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:$git_commit \
            -t gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest \
            03-BACKEND-API/

      - name: Push image to Container Registry
        run: |
          git_commit=$(git rev-parse --short HEAD)
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:$git_commit
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run (no traffic, tagged "candidate")
        run: |
          git_commit=$(git rev-parse --short HEAD)
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:$git_commit \
            --region ${{ env.REGION }} \
            --no-traffic \
            --tag candidate \
            --max-instances 3 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 60 \
            --concurrency 80 \
            --set-env-vars=BIGQUERY_PROJECT=${{ env.PROJECT_ID }}

      # A revision has no addressable URL of its own, so the previous
      # `gcloud run revisions describe --format='value(status.url)'` returned an
      # empty string and every smoke test below it curled nothing for 60s.
      # The --tag above gives the new revision a real, traffic-free URL; this
      # reads it back out of the service's traffic block.
      - name: Resolve candidate URL
        id: revision
        run: |
          revision=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format='value(status.latestCreatedRevisionName)')
          url=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} --format=json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((t.get('url','') for t in d.get('status',{}).get('traffic',[]) if t.get('tag')=='candidate'), ''))")
          if [ -z "$url" ]; then
            echo "::error::Could not resolve the candidate revision URL — refusing to shift traffic untested."
            exit 1
          fi
          echo "Candidate revision: $revision"
          echo "Candidate URL:      $url"
          echo "revision=$revision" >> $GITHUB_OUTPUT
          echo "url=$url" >> $GITHUB_OUTPUT

      # NOTE: this step used to test `steps.smoke-test.outputs.smoke_test_passed`
      # — its own output — inside itself.  Expressions are interpolated before
      # the step runs, so that was always the empty string and the guard below
      # fired `exit 1` on every run, including runs where /health returned 200.
      # The result was a deploy workflow that could never shift traffic.
      # A plain shell variable cannot have that problem.
      - name: Smoke test
        run: |
          url="${{ steps.revision.outputs.url }}"
          passed=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" "$url/health" || echo "000")
            if [ "$code" = "200" ]; then
              echo "Health check passed: $(cat /tmp/health.json)"
              passed=yes
              break
            fi
            echo "Attempt $i/30: HTTP $code, retrying in 2s..."
            sleep 2
          done
          if [ -z "$passed" ]; then
            echo "::error::Smoke test failed — /health never returned 200 on the candidate revision."
            exit 1
          fi

      - name: Test additional endpoints
        run: |
          url="${{ steps.revision.outputs.url }}"
          for path in "/api/v1/experiments?limit=5" "/api/v1/features"; do
            echo "Testing $path ..."
            curl -sf "$url$path" | grep -q '"data"' || {
              echo "::error::Endpoint check failed: $path"
              exit 1
            }
          done
          echo "All endpoint checks passed"

      - name: Shift traffic to new revision
        run: |
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --to-revisions=LATEST=100

      # Verify against the SERVICE url (what users hit), not the candidate tag —
      # the candidate URL would answer 200 whether or not traffic actually moved.
      # Also assert /health reports the commit we just built: the question
      # "which code is actually running?" took a week to answer during INC-002.
      - name: Verify traffic shift
        run: |
          git_commit=$(git rev-parse --short HEAD)
          service_url=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} --format='value(status.url)')
          body=$(curl -s "$service_url/health")
          echo "Service /health: $body"
          echo "$body" | grep -q '"status":"ok"' || {
            echo "::error::Service /health did not report ok after the traffic shift."
            exit 1
          }
          echo "$body" | grep -q "\"commit\":\"$git_commit\"" || {
            echo "::error::Service is not reporting commit $git_commit — traffic may not have shifted."
            exit 1
          }
          echo "Traffic shift verified — serving $git_commit"

      - name: Send success notification
        if: success()
        run: |
          echo "✓ Deployment successful"
          echo "Service: https://console.cloud.google.com/run/detail/${{ env.REGION }}/${{ env.SERVICE_NAME }}"
          echo "URL: ${{ steps.revision.outputs.url }}"

      - name: Send failure notification
        if: failure()
        run: |
          echo "❌ Deployment failed"
          exit 1
